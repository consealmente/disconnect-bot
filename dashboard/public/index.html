<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Voice Control · Disconnect rule</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><span class="wave" aria-hidden="true">▂▆█▃</span> Voice Control</header><main><h1>Disconnect rule</h1><p>Choose whose arrival disconnects other members in the same voice channel.</p><form><label for="trigger">Joining member</label><small>Discord user ID</small><input id="trigger" inputmode="numeric" placeholder="Paste the joining member’s ID" required><div class="row"><label for="targets">Members to disconnect</label><output id="count">0 / 75</output></div><small>Paste IDs on separate lines or separate them with commas.</small><textarea id="targets" rows="7" required placeholder="Paste target user IDs"></textarea><footer><button id="save" disabled>Save rule</button><button id="off" type="button" disabled>Disable rule</button></footer></form><p id="status" role="status">Open this page from <strong>/dashboard</strong> in your Discord server to edit its rule.</p></main></body></html>
